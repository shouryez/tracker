# Hourly trigger for the daily reminder emails: each user gets theirs at their reminder hour.
# (Vercel's Hobby plan only runs crons once a day; vercel.json has that once-a-day catch-all.)
# Needs the repository secret CRON_SECRET, the same value as CRON_SECRET on Vercel.
name: Daily reminder emails

on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send reminders due this hour
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "Add the CRON_SECRET repository secret."; exit 1; fi
          curl --fail-with-body -sS -m 280 \
            -H "Authorization: Bearer $CRON_SECRET" \
            https://dsakaro.site/api/cron/daily
